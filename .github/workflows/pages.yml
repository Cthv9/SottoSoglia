# Pubblica su GitHub Pages:
#  - radice /        -> branch main (produzione, la PWA in uso)
#  - sottocartella /preview/ -> branch di sviluppo (anteprima con banner e dati separati)
# Il deploy avviene solo tramite questa Action (Settings -> Pages -> Source: GitHub Actions).

name: Pages

on:
  push:
    branches: [main, ccr-7690d7fe-l4wzjz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Lo script di build viene dal ref che ha lanciato il workflow.
      - uses: actions/checkout@v7
        with:
          path: src

      - uses: actions/checkout@v7
        with:
          ref: main
          path: prod

      - uses: actions/checkout@v7
        with:
          ref: ccr-7690d7fe-l4wzjz
          path: preview

      - name: Costruisci il sito
        run: |
          node src/scripts/build.mjs \
            --prod prod --prod-id "$(git -C prod rev-parse --short=12 HEAD)" \
            --preview preview --preview-id "$(git -C preview rev-parse --short=12 HEAD)" \
            --out _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
