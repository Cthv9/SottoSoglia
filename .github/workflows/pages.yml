# Pubblica su GitHub Pages:
#   /          -> branch main (la PWA in uso)
#   /preview/  -> branch di sviluppo (per provare le modifiche prima del merge)
# Richiede Settings -> Pages -> Source: GitHub Actions.

name: Pages

on:
  push:
    branches: [main, ccr-7690d7fe-l4wzjz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: prod

      - uses: actions/checkout@v7
        with:
          ref: ccr-7690d7fe-l4wzjz
          path: dev

      - name: Assembla il sito
        run: |
          FILES="index.html manifest.webmanifest sw.js favicon.ico pwa-192.png pwa-512.png assets js"
          mkdir -p _site/preview
          (cd prod && cp -r $FILES ../_site/)
          (cd dev && cp -r $FILES ../_site/preview/)

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
